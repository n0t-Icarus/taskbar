name: build

# MSVC and the Windows 11 SDK are preinstalled on windows-latest, which is the
# whole reason this exists: the engine is a native x64 DLL, and building it here
# means nobody needs a multi-gigabyte local toolchain. See docs/SPEC.md 10.2.
#
# Nothing here pins a Visual Studio version, and that is a correction rather than
# a style choice. This workflow used to rely on the preset naming "Visual Studio
# 17 2022"; in 2026 windows-latest became the VS 2026 image, so the generator
# stopped existing and the configure step died in one second without compiling
# anything. docs/SPEC.md 10.6 has the details.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Enforced rather than merely documented: src/core must build with no
      # Windows SDK, or the core tests stop being runnable off-Windows.
      - name: Enforce src/core stays Windows-free
        shell: bash
        run: |
          if grep -rIn --include='*.h' --include='*.cpp' \
               -e '#include <windows' -e '#include <Windows' src/core/; then
            echo "::error::src/core must not include any Windows header"
            exit 1
          fi
          echo "src/core is Windows-free."

      # Records the toolchain the image actually handed us, and fails loudly if
      # it has no Visual Studio at all - which is the failure that cost a run.
      # The generator is reported, not passed: CMake chooses the newest one it
      # can find, and this says which that was.
      - name: Select toolchain
        shell: bash
        run: |
          set -eo pipefail
          cmake --version | head -1
          generator=$(cmake --help | grep -oE 'Visual Studio [0-9]+ [0-9]{4}' | head -1 || true)
          if [ -z "$generator" ]; then
            echo "::error::this runner offers CMake no Visual Studio generator"
            exit 1
          fi
          echo "newest Visual Studio generator on this runner: $generator"

      # configure/build/test are wrapped so a failure reaches the run page as an
      # annotation. Job logs require a signed-in session; annotations do not, and
      # a red run whose reason nobody can read is not a useful signal.
      - name: Configure
        shell: bash
        run: |
          set -eo pipefail
          if ! cmake --preset msvc-x64 2>&1 | tee configure.log; then
            bash .github/ci-annotate.sh configure.log
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          if ! cmake --build --preset msvc-x64 2>&1 | tee build.log; then
            bash .github/ci-annotate.sh build.log
            exit 1
          fi

      # --no-tests=error is explicit on purpose: it is the difference between
      # "the suite passed" and "the suite ran", and a build that quietly stops
      # registering tests must not stay green.
      - name: Test
        shell: bash
        run: |
          set -eo pipefail
          if ! ctest --preset msvc-x64 --output-on-failure --no-tests=error 2>&1 | tee ctest.log; then
            bash .github/ci-annotate.sh ctest.log
            exit 1
          fi

      # Proves the DLL is a real x64 module *carrying the entry point the
      # control surface calls*, before Task 7 onwards depends on either. The
      # x64 check alone was not enough: a 32-bit or truncated engine fails
      # inside explorer as an opaque ERROR_BAD_EXE_FORMAT, and a missing export
      # fails only when the verb is first invoked.
      #
      # This runs the same verifier the README tells you to run on the
      # downloaded artifact, so CI and the user check the identical thing rather
      # than two hand-rolled PE readers that could drift apart.
      - name: Inspect the engine DLL
        shell: bash
        run: |
          set -eo pipefail
          if ! python tools/verify_engine_dll.py \
                 build/msvc-x64/dist/TaskbarStyler.dll \
                 --expect-export TS_AbiVersion 2>&1 | tee inspect.log; then
            bash .github/ci-annotate.sh inspect.log 'FAIL|does not exist|error'
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskbarStyler
          # Task 11 adds the four .bat control files to this artifact.
          path: build/msvc-x64/dist/TaskbarStyler.dll
          if-no-files-found: error
